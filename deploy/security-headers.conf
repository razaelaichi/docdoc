# Security headers for every response from the gateway. Included in each location that sets its
# own add_header (nginx does not inherit add_header into such locations). Also read by
# client/vite.config.js (preview server) and e2e/journey.spec.js, so all three stay identical.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self'; media-src 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'; manifest-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; require-trusted-types-for 'script'; trusted-types 'none'; report-uri /api/v1/telemetry/csp; report-to csp" always;
add_header Reporting-Endpoints 'csp="/api/v1/telemetry/csp"' always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always; # legacy browsers; modern ones use frame-ancestors
add_header Referrer-Policy "no-referrer" always; # upload links carry tokens in the URL
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=(), browsing-topics=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
